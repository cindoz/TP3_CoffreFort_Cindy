{% extends "base.html" %}

{% block title %}Ajouter un utilisateur - Mon Coffre{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card p-4">
            <div class="card-body">

                <h2 class="page-title mb-2">Ajouter un utilisateur</h2>

                <p class="subtitle mb-4">
                    Remplissez les informations du nouvel utilisateur.
                </p>

                <form method="POST">

                    <div class="mb-3">
                        <label for="numero" class="form-label">
                            Numéro d'utilisateur
                        </label>

                        <input type="text"
                               class="form-control"
                               id="numero"
                               name="numero"
                               minlength="4"
                               maxlength="6"
                               pattern="[0-9]{4,6}"
                               inputmode="numeric"
                               placeholder="Ex. : 0000"
                               required>

                        <div class="form-text">
                            Entre 4 et 6 chiffres.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="mot_de_passe" class="form-label">
                            Mot de passe
                        </label>

                        <input type="password"
                               class="form-control"
                               id="mot_de_passe"
                               name="mot_de_passe"
                               minlength="4"
                               maxlength="6"
                               pattern="[0-9]{4,6}"
                               inputmode="numeric"
                               placeholder="Entrez un code"
                               required>

                        <div class="form-text">
                            Entre 4 et 6 chiffres.
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-rose">
                            Ajouter
                        </button>

                        <a href="{{ url_for('afficher_utilisateurs') }}"
                           class="btn btn-outline-secondary">
                            Annuler
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
