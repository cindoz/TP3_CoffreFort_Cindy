<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un utilisateur</title>
</head>
<body>
    <h1>Modifier un utilisateur</h1>

    <form method="POST">
        <label for="numero">Numéro d'utilisateur :</label>
        <input type="text" id="numero" name="numero"
               value="{{ utilisateur.numero }}"
               minlength="4" maxlength="6"
               pattern="[0-9]{4,6}" required>

        <br><br>

        <label for="mot_de_passe">Mot de passe :</label>
        <input type="text" id="mot_de_passe" name="mot_de_passe"
               value="{{ utilisateur.mot_de_passe }}"
               minlength="4" maxlength="6"
               pattern="[0-9]{4,6}" required>

        <br><br>

        <button type="submit">Enregistrer</button>
    </form>

    <p>
        <a href="{{ url_for('afficher_utilisateurs') }}">
            Retour aux utilisateurs
        </a>
    </p>
</body>
</html>
