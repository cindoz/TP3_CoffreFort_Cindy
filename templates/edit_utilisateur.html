{% extends "base.html" %}

{% block title %}Modifier un utilisateur - Mon Coffre{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card p-4">
            <div class="card-body">

                <h2 class="page-title mb-2">Modifier un utilisateur</h2>

                <p class="subtitle mb-4">
                    Modifiez les informations de cet utilisateur.
                </p>

                <form method="POST">

                    <div class="mb-3">
                        <label for="numero" class="form-label">
                            Numéro d'utilisateur
                        </label>

                        <input type="text"
                               class="form-control"
                               id="numero"
                               name="numero"
                               value="{{ utilisateur.numero }}"
                               minlength="4"
                               maxlength="6"
                               pattern="[0-9]{4,6}"
                               inputmode="numeric"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="mot_de_passe" class="form-label">
                            Mot de passe
                        </label>

                        <input type="password"
                               class="form-control"
                               id="mot_de_passe"
                               name="mot_de_passe"
                               value="{{ utilisateur.mot_de_passe }}"
                               minlength="4"
                               maxlength="6"
                               pattern="[0-9]{4,6}"
                               inputmode="numeric"
                               required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-rose">
                            Enregistrer
                        </button>

                        <a href="{{ url_for('afficher_utilisateurs') }}"
                           class="btn btn-outline-secondary">
                            Annuler
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
