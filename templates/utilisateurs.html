<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs - Coffre-fort</title>
</head>
<body>
    <h1>Gestion des utilisateurs</h1>
    <p>
        <a href="{{ url_for('add_utilisateur') }}">
            Ajouter un utilisateur
        </a>
    </p>

    <h2>Liste des utilisateurs</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Numéro</th>
                <th>Mot de passe</th>
            </tr>
        </thead>
        <tbody>
            {% for utilisateur in utilisateurs %}
            <tr>
                <td>{{ utilisateur.numero }}</td>
                <td>{{ utilisateur.mot_de_passe }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
