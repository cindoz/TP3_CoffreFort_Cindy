<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs - Coffre-fort</title>
</head>
<body>
    <h1>Gestion des utilisateurs</h1>

    <p>
        <a href="{{ url_for('add_utilisateur') }}">
            Ajouter un utilisateur
        </a>
    </p>

    <h2>Liste des utilisateurs</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Numéro</th>
                <th>Mot de passe</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for utilisateur in utilisateurs %}
            <tr>
                <td>{{ utilisateur.numero }}</td>
                <td>{{ utilisateur.mot_de_passe }}</td>
                <td>
                    <a href="{{ url_for('edit_utilisateur', numero=utilisateur.numero) }}">
                        Modifier
                    </a>

                    <form method="POST"
                          action="{{ url_for('supprimer_utilisateur', numero=utilisateur.numero) }}"
                          style="display: inline;"
                          onsubmit="return confirm('Supprimer cet utilisateur ?');">
                        <button type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
